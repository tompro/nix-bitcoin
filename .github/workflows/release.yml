name: Publish release

on:
  workflow_run:
    workflows: ["nix-bitcoin tests"]
    branches: [master]
    types: [completed]

permissions:
  contents: read

# Serialize tag allocation and publishing. A late older CI result must not
# replace a newer release; the publisher also checks commit ancestry.
concurrency:
  group: publish-master-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Execute trusted publisher code from master, never PR code/artifacts.
      # The tag itself points to workflow_run.head_sha, not this checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Publish tested commit with a UTC calendar tag and generated notes
        run: python3 -B helper/publish-release.py
